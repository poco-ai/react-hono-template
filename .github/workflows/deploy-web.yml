name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/shared/**"
      # web's build (tsc -b) type-checks apps/api sources via the @api/* alias,
      # so api type changes must rebuild/redeploy web as well.
      - "apps/api/**"
      - "bun.lock"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Web Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/web
        run: bun run build
        env:
          VITE_API_URL: https://react-hono-api.chenqiyuan1012.workers.dev

      - name: Deploy
        working-directory: apps/web
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
