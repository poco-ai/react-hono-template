name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: smoke-only
          POSTGRES_DB: app
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
        env:
          DATABASE_URL: postgres://app:smoke-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/app
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}
